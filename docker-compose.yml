services:
  backend:
    build:
      context: ./backend
    container_name: quantos-backend
    ports:
      - "8000:8000"
    environment:
      QUANTOS_ENV: development

  frontend:
    build:
      context: ./frontend
    container_name: quantos-frontend
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: quantos
      POSTGRES_USER: quantos
      POSTGRES_PASSWORD: quantos

  redis:
    image: redis:7
