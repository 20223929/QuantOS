name: QuantOS Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: write

jobs:
  release-validation:
    name: Release Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        run: |
          test "${GITHUB_REF_TYPE}" = "tag"
          printf '%s\n' "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

      - name: Validate source version
        run: |
          version=$(node -p "require('./frontend/package.json').version")
          expected="${GITHUB_REF_NAME#v}"
          test "$version" = "$expected"

      - name: Validate release metadata
        run: |
          test -f backend/alembic.ini
          grep -Fxq 'script_location = app/storage/migrations' backend/alembic.ini
          test -d backend/app/storage/migrations/versions
          test -f frontend/package.json

      - name: Create release manifest
        run: |
          version=$(node -p "require('./frontend/package.json').version")
          printf '%s\n' \
            'QuantOS release manifest' \
            "version=$version" \
            "tag=${GITHUB_REF_NAME}" \
            "commit=${GITHUB_SHA}" \
            "workflow=${GITHUB_WORKFLOW}" \
            "run_id=${GITHUB_RUN_ID}" > release-manifest.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if printf '%s\n' "$version" | grep -Eq -- '-'; then
            prerelease_flag='--prerelease'
          else
            prerelease_flag=''
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            if [ -n "$prerelease_flag" ]; then
              gh release edit "$tag" --title "$tag" --prerelease
            else
              gh release edit "$tag" --title "$tag" --prerelease=false
            fi
          else
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes \
              $prerelease_flag
          fi

          gh release upload "$tag" release-manifest.txt --clobber

      - name: Upload release manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantos-release-${{ github.ref_name }}
          path: release-manifest.txt
          if-no-files-found: error

  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    needs: release-validation
    if: ${{ always() }}

    steps:
      - name: Verify release validation
        run: test "${{ needs.release-validation.result }}" = "success"

      - name: Release approved
        run: echo "QuantOS release ${GITHUB_REF_NAME} approved"
