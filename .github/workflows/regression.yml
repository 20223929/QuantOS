name: QuantOS Regression

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  backend:
    name: Backend Regression (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Validate Alembic configuration
        run: |
          cd backend
          test -f alembic.ini
          grep -Fxq 'script_location = app/storage/migrations' alembic.ini
          grep -Fxq 'sqlalchemy.url = sqlite:///./quantos.db' alembic.ini

      - name: Validate database migration
        run: |
          cd backend
          alembic -c alembic.ini upgrade head
          current=$(alembic -c alembic.ini current)
          heads=$(alembic -c alembic.ini heads)
          printf '%s\n' "$current"
          printf '%s\n' "$heads"
          printf '%s\n' "$current" | grep -q '0005_order_reason'
          printf '%s\n' "$heads" | grep -q '0005_order_reason'

      - name: Run backend tests
        run: |
          cd backend
          pytest

  frontend:
    name: Frontend Regression (Node 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npx tsc --noEmit
          npm run build
          test -f dist/index.html

      - name: Prepare release manifest
        run: |
          version=$(node -p "require('./frontend/package.json').version")
          test -n "$version"
          cat > frontend/dist/release-manifest.txt <<EOF
          QuantOS frontend release manifest
          version=$version
          commit=${GITHUB_SHA}
          ref=${GITHUB_REF_NAME}
          workflow=${GITHUB_WORKFLOW}
          run_id=${GITHUB_RUN_ID}
          EOF

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantos-frontend-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error

  release-artifacts:
    name: Release Artifact Dry-Run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create source archive and checksum
        run: |
          version=$(node -p "require('./frontend/package.json').version")
          archive="QuantOS-${version}-source.tar.gz"
          git archive --format=tar.gz --output="$archive" "$GITHUB_SHA"
          sha256sum "$archive" > SHA256SUMS
          test -s "$archive"
          test -s SHA256SUMS
          test "$(awk '{print $2}' SHA256SUMS)" = "$archive"
          sha256sum -c SHA256SUMS

      - name: Create and verify release manifest
        run: |
          version=$(node -p "require('./frontend/package.json').version")
          printf '%s\n' \
            'QuantOS release manifest' \
            "version=$version" \
            "ref=${GITHUB_REF_NAME}" \
            "commit=${GITHUB_SHA}" \
            "workflow=${GITHUB_WORKFLOW}" \
            "run_id=${GITHUB_RUN_ID}" > release-manifest.txt
          test -s release-manifest.txt
          grep -Fxq "version=$version" release-manifest.txt
          grep -Fxq "commit=${GITHUB_SHA}" release-manifest.txt
          grep -Fxq "ref=${GITHUB_REF_NAME}" release-manifest.txt

      - name: Upload release dry-run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quantos-release-dry-run-${{ github.sha }}
          path: |
            release-manifest.txt
            QuantOS-*-source.tar.gz
            SHA256SUMS
          if-no-files-found: error

  quality-gate:
    name: Release Quality Gate
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - release-artifacts
    if: ${{ always() }}

    steps:
      - name: Verify regression matrix
        run: |
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.release-artifacts.result }}" = "success"

      - name: Release gate passed
        run: echo "QuantOS release quality gate passed"
