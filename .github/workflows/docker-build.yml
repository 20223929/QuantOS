name: Docker Build

on:
  push:
    branches:
      - develop
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve build metadata
        id: metadata
        shell: bash
        run: |
          version=$(node -p "require('./frontend/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Validate release version for tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          printf '%s\n' "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          test "${{ steps.metadata.outputs.version }}" = "${GITHUB_REF_NAME#v}"

      - name: Docker build
        run: |
          docker build \
            --build-arg BUILD_VERSION="${{ steps.metadata.outputs.version }}" \
            --build-arg BUILD_TAG="${{ steps.metadata.outputs.tag }}" \
            --build-arg BUILD_COMMIT="${{ steps.metadata.outputs.commit }}" \
            -t quantos-next:${GITHUB_SHA} .
          docker tag quantos-next:${GITHUB_SHA} quantos-next:ci

      - name: Docker image metadata
        run: |
          docker image inspect quantos-next:${GITHUB_SHA} --format '{{.Id}}'
          docker image inspect quantos-next:${GITHUB_SHA} --format '{{.RepoTags}}'
          docker image inspect quantos-next:${GITHUB_SHA} --format '{{index .Config.Labels "org.opencontainers.image.version"}}'
          docker image inspect quantos-next:${GITHUB_SHA} --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
          docker image inspect quantos-next:${GITHUB_SHA} --format '{{index .Config.Labels "org.opencontainers.image.ref.name"}}'

      - name: Release image tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker tag quantos-next:${GITHUB_SHA} quantos-next:${GITHUB_REF_NAME}
          docker image inspect quantos-next:${GITHUB_REF_NAME} --format '{{.RepoTags}}'
